<h1 class="mt-5">Student Task</h1>
<div class="container">
    <div class="row">

        <div class="col-5 col-md-4 mt-5">
            <div class="card bg-light">
                <h2 class="ml-2">{{!isOnEditMode?"Add Student":"update Student"}}</h2>
                <div class="card-body">
                    <div class="form-group">
                        <label for="fname">First Name</label>
                        <input type="text" class="form-control" #fnameRef placeholder="Enter First Name">
                    </div>

                    <div class="form-group">
                        <label for="lname">Last Name</label>
                        <input type="text" class="form-control" #lnameRef placeholder="Enter Last Name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" #emailRef placeholder="Enter Email">
                    </div>

                    <div class="form-group">
                        <label for="contact">Contact</label>
                        <input type="number" class="form-control" #contactRef placeholder="Enter Contact">
                    </div>

                    <div class="form-group">
                        <label for="isActive">Is Active</label>
                        <select class="form-control" #activeRef>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>

                    <button (click)="onAddStd()" *ngIf="!isOnEditMode" mat-raised-button color="primary"
                        class="mt-3 w-100">Add
                        Student</button>
                    <button (click)="onUpdateStd()" *ngIf="isOnEditMode" mat-raised-button color="primary"
                        class="mt-3 w-100">Update
                        Student</button>


                </div>
            </div>
        </div>
        <div class="col-7 col-md-8 mt-5">
            <div class="card">
                <div class="card-body">
                    <div class="table table-responsive table-striped">
                        <table class="table table-bordered" *ngIf="stdsArr.length>0; else noStudents">
                            <thead>
                                <tr>
                                    <th>Sr No</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Contact</th>
                                    <th>IsActive</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let std of stdsArr; let i=index; trackBy:trackByStdId">
                                    <td>{{i+1}}</td>
                                    <td>{{std.fname}} {{std.lname}}</td>
                                    <td>{{std.email}}</td>
                                    <td>{{std.contact}}</td>
                                    <td class="text-center">
                                        <span class="badge" [ngClass]="{
                                'badge-success':std.isActive,
                                'badge-danger':!std.isActive
                            }">{{std.isActive?'Yes':'No'}}</span>
                                    </td>
                                    <td><button class="btn btn-sm btn-outline-primary btn-block"
                                            (click)="onEditStd(std)">Edit</button></td>
                                    <td><button class="btn btn-sm btn-outline-danger btn-block"
                                            (click)="onRemovestd(std.stdId)"
                                            [disabled]="isOnEditMode&&editId===std.stdId">Delete</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <ng-template #noStudents>
                <p class="alert alert-info">No Student Found</p>
            </ng-template>
        </div>


    </div>
</div>
